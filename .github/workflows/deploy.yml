name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege by default; the deploy job adds only what it needs.
permissions:
  contents: read

# The documented Pages pattern: queue deploys rather than cancelling one mid-flight.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches local; the project has only ever been built and tested on 24.
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm test

      # `npm run build` is `tsc --noEmit && vite build`, so typechecking happens here
      # rather than as a duplicate step.
      - run: npm run build

      # Pull requests are built and tested but never deployed.
      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
